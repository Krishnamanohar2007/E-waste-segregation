services:

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongodb:27017/ewasteDB
      ML_SERVICE_URL: http://ml-service:8000/predict
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  ml-service:
    build: ./ml-service
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongodb_data:
